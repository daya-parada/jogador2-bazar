<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogador 2 Bazar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- javascript com defer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- ===== INICIO do header (POSSÍVEL CONFLITO, CUIDADO AO ALTERAR!) ===== -->
    <header class="sticky-top">
        <!-- HUD -->
        <div class="hud py-3">
            <div class="container d-flex justify-content-between align-items-center gap-3">
                <span>Game over <span class="hud-hl">para o desperdício!</span></span>
                <span class="d-none d-md-inline">Hi-score <i class="bi bi-coin hud-coin" aria-hidden="true"></i> <span class="hud-hl">3.522 itens trocados</span></span>
            </div>
        </div>
        <!-- navbar -->
        <nav class="navbar navbar-expand-lg navbar-px py-5 py-lg-4">
            <div class="container">
                <a class="navbar-brand me-0 me-lg-3" href="index.html"><img src="img/logo-black.png" alt="Jogador 2 Bazar"></a>
                <div class="d-flex align-items-center gap-3 order-lg-last">
                    <a class="btn btn-px btn-px-blue btn-sm d-none d-sm-inline-block" href="client.html" aria-label="Entrar na conta">
                        <i class="bi bi-person-fill" aria-hidden="true"></i>
                    </a>
                    <button class="btn btn-px btn-px-yellow btn-sm position-relative" type="button">
                        <i class="bi bi-cart3" aria-hidden="true"></i><span class="d-none d-md-inline ms-2">Carrinho</span>
                        <span class="visually-hidden">, itens:</span>
                        <span class="position-absolute top-0 start-100 translate-middle px-count cart-count">0</span>
                    </button>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav mx-auto gap-2 pt-3 pb-2 py-lg-0">
                    <li class="nav-item"><a class="nav-link d-flex align-items-center gap-2" href="index.html"><i class="bi bi-house-heart-fill" aria-hidden="true"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link d-flex align-items-center gap-2" href="catalogue.html"><i class="bi bi-shop" aria-hidden="true"></i>Catalogo</a></li>
                    <li class="nav-item"><a class="nav-link d-flex align-items-center gap-2" href="about.html"><i class="bi bi-heart" aria-hidden="true"></i>Sobre</a></li>
                    <li class="nav-item"><a class="nav-link d-flex align-items-center gap-2" href="info.html"><i class="bi bi-info-square" aria-hidden="true"></i>Info</a></li>
                    <li class="nav-item"><a class="nav-link d-flex align-items-center gap-2 active" aria-current="page" href="faq.html"><i class="bi bi-question-square" aria-hidden="true"></i>FAQ</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header> <!-- xx==xx== FIN do header xx==xx== -->

    <!-- ===== main (IGOR) ===== -->
    <main class="container py-5 flex-grow-1">

        <header class="mb-4">
            <h1>FAQ</h1>
        </header>

        <section id="perguntas" class="py-5" aria-label="Perguntas frequentes">
            <!-- Acordeão com perguntas e respostas -->
        </section>
    </main> <!-- xx==xx== FIM do main (IGOR) xx==xx== -->
    
    <!-- ===== INICIO footer (JOÃO) ===== -->
    <footer class="footer-px mt-5 pt-5 pb-4">

    </footer> <!-- xx==xx== FIM do footer xx==xx== -->
</body>
</html>
